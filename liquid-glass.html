<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIQUID GLASS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Fira+Code:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #03060e;
    --surface:   #070d1c;
    --panel:     #0a1226;
    --border:    #112040;
    --accent:    #00c8ff;
    --accent2:   #7b35ff;
    --glow:      rgba(0,200,255,0.18);
    --text:      #c8d8f0;
    --dim:       #4a6080;
    --white:     #e8f4ff;
  }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Fira Code', monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Animated grain overlay */
  body::before {
    content: '';
    position: fixed; inset: 0; z-index: 999;
    pointer-events: none;
    opacity: 0.025;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 200px 200px;
    animation: grain 0.4s steps(1) infinite;
  }
  @keyframes grain { 0%,100%{background-position:0 0} 20%{background-position:-60px 30px} 40%{background-position:30px -50px} 60%{background-position:-80px 20px} 80%{background-position:50px -40px} }

  header {
    padding: 36px 48px 24px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: baseline; gap: 20px;
    background: linear-gradient(180deg, rgba(0,200,255,0.04) 0%, transparent 100%);
  }
  header h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300; font-size: 2.6rem; letter-spacing: 0.18em;
    color: var(--white);
    text-shadow: 0 0 40px rgba(0,200,255,0.5);
  }
  header span {
    font-size: 0.7rem; letter-spacing: 0.25em; color: var(--dim);
    text-transform: uppercase;
  }
  .accent-dot { color: var(--accent); }

  .workspace {
    display: grid;
    grid-template-columns: 1fr 280px;
    gap: 0;
    min-height: calc(100vh - 100px);
  }

  /* ── CANVAS ZONE ── */
  .canvas-zone {
    padding: 32px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 20px;
    position: relative;
    border-right: 1px solid var(--border);
  }

  #drop-zone {
    width: 100%; max-width: 700px;
    min-height: 420px;
    border: 1px dashed var(--border);
    border-radius: 4px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px;
    cursor: pointer;
    position: relative;
    transition: border-color 0.3s, background 0.3s;
    background: var(--surface);
    overflow: hidden;
  }
  #drop-zone::before {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 50%, rgba(0,200,255,0.04) 0%, transparent 70%);
    pointer-events: none;
  }
  #drop-zone.drag-over {
    border-color: var(--accent);
    background: rgba(0,200,255,0.05);
  }
  #drop-zone:hover { border-color: rgba(0,200,255,0.4); }

  .drop-icon {
    width: 52px; height: 52px;
    border: 1px solid var(--border);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: var(--dim);
    font-size: 1.4rem;
  }
  .drop-label { font-size: 0.75rem; color: var(--dim); letter-spacing: 0.1em; text-align: center; line-height: 1.7; }
  .drop-label strong { color: var(--accent); font-weight: 400; }
  #file-input { display: none; }

  /* canvas sits inside drop zone when media loaded */
  #gl-canvas {
    display: none;
    max-width: 100%; max-height: 70vh;
    border-radius: 2px;
    image-rendering: pixelated;
  }
  #drop-zone.has-media { cursor: default; }
  #drop-zone.has-media .drop-prompt { display: none; }
  #drop-zone.has-media #gl-canvas { display: block; }

  .canvas-footer {
    display: flex; gap: 12px; align-items: center;
    width: 100%; max-width: 700px;
    flex-wrap: wrap;
  }
  .file-name {
    font-size: 0.65rem; color: var(--dim); letter-spacing: 0.08em;
    flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .btn-change {
    font-family: 'Fira Code', monospace;
    font-size: 0.65rem; letter-spacing: 0.1em; color: var(--dim);
    background: transparent; border: 1px solid var(--border);
    padding: 6px 12px; cursor: pointer; border-radius: 2px;
    transition: color 0.2s, border-color 0.2s;
  }
  .btn-change:hover { color: var(--accent); border-color: var(--accent); }

  /* ── SIDEBAR ── */
  .sidebar {
    padding: 28px 22px;
    display: flex; flex-direction: column; gap: 32px;
    background: var(--panel);
  }

  .section-label {
    font-size: 0.6rem; letter-spacing: 0.25em; text-transform: uppercase;
    color: var(--dim); margin-bottom: 14px;
    display: flex; align-items: center; gap: 8px;
  }
  .section-label::after {
    content: ''; flex: 1; height: 1px; background: var(--border);
  }

  .control-group { display: flex; flex-direction: column; gap: 16px; }

  .control { display: flex; flex-direction: column; gap: 6px; }
  .control-header { display: flex; justify-content: space-between; align-items: center; }
  .ctrl-name { font-size: 0.65rem; letter-spacing: 0.12em; color: var(--text); }
  .ctrl-val {
    font-size: 0.65rem; color: var(--accent);
    min-width: 32px; text-align: right;
  }

  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 2px;
    background: var(--border); border-radius: 0; cursor: pointer; outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px; height: 12px;
    background: var(--accent); border-radius: 50%;
    box-shadow: 0 0 8px rgba(0,200,255,0.7);
    transition: transform 0.15s;
  }
  input[type=range]:hover::-webkit-slider-thumb { transform: scale(1.3); }
  input[type=range]::-moz-range-thumb {
    width: 12px; height: 12px; border: none;
    background: var(--accent); border-radius: 50%;
    box-shadow: 0 0 8px rgba(0,200,255,0.7);
  }

  /* Preset buttons */
  .presets { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .preset-btn {
    font-family: 'Fira Code', monospace;
    font-size: 0.6rem; letter-spacing: 0.08em; text-transform: uppercase;
    background: transparent; border: 1px solid var(--border);
    color: var(--dim); padding: 8px 6px; cursor: pointer; border-radius: 2px;
    transition: all 0.2s;
  }
  .preset-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--glow); }
  .preset-btn.active { border-color: var(--accent); color: var(--accent); background: var(--glow); }

  /* Export */
  .export-section { margin-top: auto; }

  .export-config { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
  .export-row { display: flex; align-items: center; justify-content: space-between; }
  .export-row label { font-size: 0.63rem; letter-spacing: 0.08em; color: var(--dim); }
  .export-row select {
    font-family: 'Fira Code', monospace; font-size: 0.63rem;
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text); padding: 4px 8px; border-radius: 2px; cursor: pointer;
    outline: none;
  }

  .export-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .export-btn {
    font-family: 'Fira Code', monospace;
    font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase;
    padding: 12px 8px; border: 1px solid; border-radius: 2px; cursor: pointer;
    transition: all 0.2s; position: relative; overflow: hidden;
  }
  .export-btn.gif {
    background: transparent;
    border-color: var(--accent); color: var(--accent);
  }
  .export-btn.gif:hover {
    background: var(--glow);
    box-shadow: 0 0 20px rgba(0,200,255,0.3);
  }
  .export-btn.mp4 {
    background: transparent;
    border-color: var(--accent2); color: var(--accent2);
  }
  .export-btn.mp4:hover {
    background: rgba(123,53,255,0.15);
    box-shadow: 0 0 20px rgba(123,53,255,0.3);
  }
  .export-btn:disabled {
    opacity: 0.35; cursor: not-allowed;
    box-shadow: none !important;
    background: transparent !important;
  }

  /* Progress bar */
  .progress-wrap {
    display: none; margin-top: 12px;
    flex-direction: column; gap: 6px;
  }
  .progress-wrap.active { display: flex; }
  .progress-bar {
    width: 100%; height: 2px;
    background: var(--border); border-radius: 0; overflow: hidden;
  }
  .progress-fill {
    height: 100%; background: var(--accent);
    width: 0%; transition: width 0.1s;
    box-shadow: 0 0 8px var(--accent);
  }
  .progress-label {
    font-size: 0.6rem; letter-spacing: 0.1em; color: var(--dim);
  }

  /* Toast */
  .toast {
    position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--surface); border: 1px solid var(--border);
    padding: 12px 24px; border-radius: 2px;
    font-size: 0.7rem; letter-spacing: 0.1em; color: var(--text);
    opacity: 0; transition: all 0.3s; pointer-events: none; z-index: 1000;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.error { border-color: #ff4060; color: #ff4060; }

  /* Scanline ambient */
  .canvas-zone::after {
    content: '';
    position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, transparent 0px, transparent 3px, rgba(0,0,0,0.03) 3px, rgba(0,0,0,0.03) 4px);
  }

  @media (max-width: 768px) {
    .workspace { grid-template-columns: 1fr; }
    .sidebar { border-top: 1px solid var(--border); }
    header { padding: 20px 24px 16px; }
    header h1 { font-size: 1.8rem; }
  }
</style>
</head>
<body>

<header>
  <h1>LIQUID <span class="accent-dot">·</span> GLASS</h1>
  <span>WebGL Refraction Engine</span>
</header>

<div class="workspace">
  <div class="canvas-zone">
    <div id="drop-zone">
      <div class="drop-prompt" style="display:flex;flex-direction:column;align-items:center;gap:14px">
        <div class="drop-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
        </div>
        <div class="drop-label">
          <strong>Drop a PNG or MP4</strong><br>
          or click to browse<br>
          <span style="font-size:0.65rem;color:#2a3a50">max 50MB · PNG / MP4 / WEBM</span>
        </div>
      </div>
      <canvas id="gl-canvas"></canvas>
      <input type="file" id="file-input" accept="image/png,image/jpeg,video/mp4,video/webm">
    </div>
    <div class="canvas-footer">
      <span class="file-name" id="file-name">no file loaded</span>
      <button class="btn-change" id="btn-change">change file</button>
    </div>
  </div>

  <div class="sidebar">
    <div>
      <div class="section-label">effect</div>
      <div class="control-group">
        <div class="control">
          <div class="control-header">
            <span class="ctrl-name">distortion</span>
            <span class="ctrl-val" id="val-intensity">1.0</span>
          </div>
          <input type="range" id="intensity" min="0" max="3" step="0.05" value="1.0">
        </div>
        <div class="control">
          <div class="control-header">
            <span class="ctrl-name">flow speed</span>
            <span class="ctrl-val" id="val-speed">0.5</span>
          </div>
          <input type="range" id="speed" min="0.05" max="3" step="0.05" value="0.5">
        </div>
        <div class="control">
          <div class="control-header">
            <span class="ctrl-name">caustics</span>
            <span class="ctrl-val" id="val-caustics">0.6</span>
          </div>
          <input type="range" id="caustics" min="0" max="2" step="0.05" value="0.6">
        </div>
        <div class="control">
          <div class="control-header">
            <span class="ctrl-name">aberration</span>
            <span class="ctrl-val" id="val-aberration">0.5</span>
          </div>
          <input type="range" id="aberration" min="0" max="2" step="0.05" value="0.5">
        </div>
        <div class="control">
          <div class="control-header">
            <span class="ctrl-name">specular</span>
            <span class="ctrl-val" id="val-specular">0.5</span>
          </div>
          <input type="range" id="specular" min="0" max="2" step="0.05" value="0.5">
        </div>
        <div class="control">
          <div class="control-header">
            <span class="ctrl-name">scale</span>
            <span class="ctrl-val" id="val-scale">1.0</span>
          </div>
          <input type="range" id="scale" min="0.3" max="4" step="0.05" value="1.0">
        </div>
      </div>
    </div>

    <div>
      <div class="section-label">presets</div>
      <div class="presets">
        <button class="preset-btn active" data-preset="default">default</button>
        <button class="preset-btn" data-preset="ripple">ripple</button>
        <button class="preset-btn" data-preset="deep">deep sea</button>
        <button class="preset-btn" data-preset="wild">fractured</button>
        <button class="preset-btn" data-preset="subtle">subtle</button>
        <button class="preset-btn" data-preset="prism">prism</button>
      </div>
    </div>

    <div class="export-section">
      <div class="section-label">export</div>
      <div class="export-config">
        <div class="export-row">
          <label>duration</label>
          <select id="export-duration">
            <option value="2">2 sec</option>
            <option value="3" selected>3 sec</option>
            <option value="5">5 sec</option>
            <option value="8">8 sec</option>
          </select>
        </div>
        <div class="export-row">
          <label>gif quality</label>
          <select id="gif-quality">
            <option value="5">high</option>
            <option value="10" selected>medium</option>
            <option value="20">low (fast)</option>
          </select>
        </div>
        <div class="export-row">
          <label>gif fps</label>
          <select id="gif-fps">
            <option value="15">15 fps</option>
            <option value="24" selected>24 fps</option>
            <option value="30">30 fps</option>
          </select>
        </div>
      </div>
      <div class="export-btns">
        <button class="export-btn gif" id="btn-gif" disabled>export gif</button>
        <button class="export-btn mp4" id="btn-mp4" disabled>export mp4</button>
      </div>
      <div class="progress-wrap" id="progress-wrap">
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        <span class="progress-label" id="progress-label">encoding…</span>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- ─── SHADERS ─────────────────────────────────────────────────────────── -->
<script id="vert-shader" type="x-shader/x-vertex">
attribute vec2 aPosition;
attribute vec2 aTexCoord;
varying vec2 vTexCoord;
void main() {
  vTexCoord = aTexCoord;
  gl_Position = vec4(aPosition, 0.0, 1.0);
}
</script>

<script id="frag-shader" type="x-shader/x-fragment">
precision highp float;

uniform sampler2D uTexture;
uniform float uTime;
uniform float uIntensity;
uniform float uSpeed;
uniform float uCaustics;
uniform float uAberration;
uniform float uSpecular;
uniform float uScale;

varying vec2 vTexCoord;

// ─── Smooth fractal noise displacement ───────────────────────────────────
float wave(vec2 p, float t) {
  float w = 0.0;
  w += sin(p.x * 5.1 + t * 1.13) * cos(p.y * 4.6 - t * 0.71) * 1.0;
  w += sin(p.x * 9.3 - p.y * 6.7 + t * 0.89) * 0.6;
  w += cos(p.x * 3.2 + p.y * 8.9 - t * 1.27) * 0.7;
  w += sin((p.x + p.y) * 7.8 + t * 0.62) * 0.45;
  w += cos(p.x * 14.1 - p.y * 3.5 + t * 1.51) * 0.25;
  w += sin(p.x * 2.7 + p.y * 11.4 - t * 0.44) * 0.3;
  return w;
}

// ─── Caustic light simulation ─────────────────────────────────────────────
float causticLight(vec2 uv, float t) {
  vec2 p = uv * 4.0;
  float c = 0.0;
  for(int i = 0; i < 5; i++) {
    float fi = float(i);
    // Fold + rotate space — creates tangled light paths
    p = abs(p) - 0.6;
    float a = t * 0.15 + fi * 1.31;
    float cs = cos(a), sn = sin(a);
    p = vec2(cs * p.x - sn * p.y, sn * p.x + cs * p.y);
    c += sin(p.x + sin(p.y + t * 0.25 + fi));
  }
  // Bright caustic peaks
  float raw = c * 0.2 + 0.5;
  return pow(max(0.0, raw), 3.0) * 2.5;
}

// ─── Secondary ripple caustic overlay ─────────────────────────────────────
float caustic2(vec2 uv, float t) {
  vec2 p = uv * 6.0;
  float c = 0.0;
  c += sin(p.x * 1.3 + t * 0.41) * sin(p.y * 1.1 - t * 0.37);
  c += sin((p.x - p.y) * 1.7 + t * 0.53) * 0.5;
  c += cos(length(p - vec2(sin(t * 0.2) * 3.0, cos(t * 0.17) * 3.0)) * 1.5 - t * 0.6) * 0.7;
  return pow(max(0.0, c * 0.3 + 0.5), 2.5);
}

void main() {
  vec2 uv = vTexCoord;
  float t = uTime * uSpeed;
  float sc = uScale;
  vec2 suv = (uv - 0.5) / sc + 0.5; // scaled UV for sampling wave patterns

  // ── Surface displacement from gradient of wave field ──────────────────
  float eps = 0.002;
  float h   = wave(suv * 2.0, t);
  float hx  = wave((suv + vec2(eps, 0.0)) * 2.0, t);
  float hy  = wave((suv + vec2(0.0, eps)) * 2.0, t);

  vec2 normal = vec2(hx - h, hy - h) / eps;
  float normalLen = length(normal);

  float disp = uIntensity * 0.022;
  vec2 offset = normal * disp;

  // ── Chromatic aberration — separate R/G/B sampling ────────────────────
  float abr = uAberration * 0.004;
  vec2 aberVec = normalize(normal + vec2(0.001)) * abr;

  vec2 rUV = clamp(uv + offset + aberVec,              vec2(0.001), vec2(0.999));
  vec2 gUV = clamp(uv + offset,                         vec2(0.001), vec2(0.999));
  vec2 bUV = clamp(uv + offset - aberVec,              vec2(0.001), vec2(0.999));

  float r = texture2D(uTexture, rUV).r;
  float g = texture2D(uTexture, gUV).g;
  float b = texture2D(uTexture, bUV).b;
  float a = texture2D(uTexture, gUV).a;

  vec4 color = vec4(r, g, b, a);

  // ── Caustic light overlay ─────────────────────────────────────────────
  float caus1 = causticLight(suv + offset * 1.5, t);
  float caus2 = caustic2(suv * 0.8 - offset * 2.0, t * 0.7);
  float causTotal = (caus1 * 0.65 + caus2 * 0.35) * uCaustics;

  // Caustic tint: slightly blue-cyan like real water caustics
  vec3 causColor = vec3(0.55, 0.82, 1.0) * causTotal * 0.18;
  color.rgb += causColor * color.rgb * 0.9;
  // Bright caustic flares
  color.rgb += vec3(0.7, 0.88, 1.0) * pow(caus1, 4.0) * uCaustics * 0.15;

  // ── Specular highlights on the undulating surface ─────────────────────
  // Use the wave normal as a micro-facet, lit from above-right
  vec3 viewDir = vec3(0.0, 0.0, 1.0);
  vec3 lightDir = normalize(vec3(0.5, 0.7, 0.8));
  vec3 surfNormal = normalize(vec3(normal.x, normal.y, 3.0 / max(0.5, uIntensity)));
  vec3 halfVec = normalize(lightDir + viewDir);
  float spec = pow(max(0.0, dot(surfNormal, halfVec)), 40.0 + (1.0 - uSpecular) * 60.0);
  // Secondary specular lobe
  vec3 lightDir2 = normalize(vec3(-0.6, 0.4, 0.9));
  vec3 halfVec2 = normalize(lightDir2 + viewDir);
  float spec2 = pow(max(0.0, dot(surfNormal, halfVec2)), 25.0);

  vec3 specColor = vec3(0.85, 0.93, 1.0);
  color.rgb += specColor * (spec * 0.55 + spec2 * 0.2) * uSpecular;

  // ── Fresnel-like edge darkening / brightening ─────────────────────────
  float edgeDist = min(min(uv.x, 1.0 - uv.x), min(uv.y, 1.0 - uv.y));
  float fresnel = pow(1.0 - smoothstep(0.0, 0.12, edgeDist), 2.0);
  color.rgb = mix(color.rgb, color.rgb * vec3(0.6, 0.78, 1.0) * 1.25, fresnel * 0.35);

  // ── Subtle global glass tint ──────────────────────────────────────────
  vec3 glassTint = vec3(0.88, 0.96, 1.0);
  color.rgb = mix(color.rgb, color.rgb * glassTint, 0.12 * uIntensity);

  // ── Very slight vignette ──────────────────────────────────────────────
  float vignette = smoothstep(0.0, 0.5, edgeDist);
  color.rgb *= mix(0.88, 1.0, vignette);

  gl_FragColor = vec4(clamp(color.rgb, 0.0, 1.5), a);
}
</script>

<!-- ─── MAIN JS ────────────────────────────────────────────────────────────── -->
<script>
// ══════════════════════════════════════════════════════════════════════════════
//  DOM
// ══════════════════════════════════════════════════════════════════════════════
const dropZone   = document.getElementById('drop-zone');
const fileInput  = document.getElementById('file-input');
const glCanvas   = document.getElementById('gl-canvas');
const fileNameEl = document.getElementById('file-name');
const btnChange  = document.getElementById('btn-change');
const btnGif     = document.getElementById('btn-gif');
const btnMp4     = document.getElementById('btn-mp4');
const toastEl    = document.getElementById('toast');
const progressWrap = document.getElementById('progress-wrap');
const progressFill = document.getElementById('progress-fill');
const progressLbl  = document.getElementById('progress-label');

const sliders = {
  intensity:  document.getElementById('intensity'),
  speed:      document.getElementById('speed'),
  caustics:   document.getElementById('caustics'),
  aberration: document.getElementById('aberration'),
  specular:   document.getElementById('specular'),
  scale:      document.getElementById('scale'),
};

// ══════════════════════════════════════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════════════════════════════════════
let gl, program, uniforms;
let texture;
let mediaSource = null; // {type:'image'|'video', el}
let animFrame;
let startTime = performance.now();
let isExporting = false;

// ══════════════════════════════════════════════════════════════════════════════
//  WEBGL INIT
// ══════════════════════════════════════════════════════════════════════════════
function initGL() {
  gl = glCanvas.getContext('webgl', {
    preserveDrawingBuffer: true,
    antialias: true,
    premultipliedAlpha: false,
  });
  if (!gl) { showToast('WebGL not supported', true); return false; }

  const vertSrc = document.getElementById('vert-shader').textContent;
  const fragSrc = document.getElementById('frag-shader').textContent;

  function compileShader(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      console.error(gl.getShaderInfoLog(s));
      return null;
    }
    return s;
  }

  const vert = compileShader(gl.VERTEX_SHADER, vertSrc);
  const frag = compileShader(gl.FRAGMENT_SHADER, fragSrc);
  program = gl.createProgram();
  gl.attachShader(program, vert);
  gl.attachShader(program, frag);
  gl.linkProgram(program);
  gl.useProgram(program);

  // Full-screen quad
  const positions = new Float32Array([-1,-1, 1,-1, -1,1, 1,1]);
  const texCoords = new Float32Array([ 0, 1, 1, 1,  0,0, 1,0]);

  const posBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
  gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW);
  const aPos = gl.getAttribLocation(program, 'aPosition');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

  const tcBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, tcBuf);
  gl.bufferData(gl.ARRAY_BUFFER, texCoords, gl.STATIC_DRAW);
  const aTex = gl.getAttribLocation(program, 'aTexCoord');
  gl.enableVertexAttribArray(aTex);
  gl.vertexAttribPointer(aTex, 2, gl.FLOAT, false, 0, 0);

  uniforms = {
    uTexture:    gl.getUniformLocation(program, 'uTexture'),
    uTime:       gl.getUniformLocation(program, 'uTime'),
    uIntensity:  gl.getUniformLocation(program, 'uIntensity'),
    uSpeed:      gl.getUniformLocation(program, 'uSpeed'),
    uCaustics:   gl.getUniformLocation(program, 'uCaustics'),
    uAberration: gl.getUniformLocation(program, 'uAberration'),
    uSpecular:   gl.getUniformLocation(program, 'uSpecular'),
    uScale:      gl.getUniformLocation(program, 'uScale'),
  };

  texture = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, texture);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

  return true;
}

// ══════════════════════════════════════════════════════════════════════════════
//  TEXTURE UPLOAD
// ══════════════════════════════════════════════════════════════════════════════
function uploadTexture(source) {
  gl.bindTexture(gl.TEXTURE_2D, texture);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, source);
}

// ══════════════════════════════════════════════════════════════════════════════
//  RENDER LOOP
// ══════════════════════════════════════════════════════════════════════════════
function render(ts) {
  if (!gl || !mediaSource) { animFrame = requestAnimationFrame(render); return; }

  if (mediaSource.type === 'video' && !mediaSource.el.paused && !mediaSource.el.ended) {
    uploadTexture(mediaSource.el);
  }

  const elapsed = (ts - startTime) * 0.001;

  gl.viewport(0, 0, glCanvas.width, glCanvas.height);
  gl.clearColor(0, 0, 0, 1);
  gl.clear(gl.COLOR_BUFFER_BIT);

  gl.useProgram(program);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, texture);
  gl.uniform1i(uniforms.uTexture, 0);
  gl.uniform1f(uniforms.uTime, elapsed);
  gl.uniform1f(uniforms.uIntensity,  parseFloat(sliders.intensity.value));
  gl.uniform1f(uniforms.uSpeed,      parseFloat(sliders.speed.value));
  gl.uniform1f(uniforms.uCaustics,   parseFloat(sliders.caustics.value));
  gl.uniform1f(uniforms.uAberration, parseFloat(sliders.aberration.value));
  gl.uniform1f(uniforms.uSpecular,   parseFloat(sliders.specular.value));
  gl.uniform1f(uniforms.uScale,      parseFloat(sliders.scale.value));
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  animFrame = requestAnimationFrame(render);
}

// ══════════════════════════════════════════════════════════════════════════════
//  LOAD MEDIA
// ══════════════════════════════════════════════════════════════════════════════
function loadMedia(file) {
  if (!file) return;
  const isVideo = file.type.startsWith('video/');
  const isImage = file.type === 'image/png' || file.type === 'image/jpeg' || file.type === 'image/webp';
  if (!isVideo && !isImage) { showToast('Please load a PNG or MP4 file', true); return; }

  fileNameEl.textContent = file.name;

  if (mediaSource?.type === 'video') {
    mediaSource.el.pause();
    mediaSource.el.src = '';
  }

  const url = URL.createObjectURL(file);

  if (isImage) {
    const img = new Image();
    img.onload = () => {
      setupCanvas(img.naturalWidth, img.naturalHeight);
      uploadTexture(img);
      mediaSource = { type: 'image', el: img };
      activateUI();
    };
    img.src = url;
  } else {
    const vid = document.createElement('video');
    vid.muted = true; vid.loop = true; vid.playsInline = true;
    vid.src = url;
    vid.addEventListener('loadeddata', () => {
      setupCanvas(vid.videoWidth, vid.videoHeight);
      uploadTexture(vid);
      mediaSource = { type: 'video', el: vid };
      vid.play();
      activateUI();
    });
    vid.load();
  }
}

function setupCanvas(w, h) {
  const MAX = 800;
  let cw = w, ch = h;
  if (cw > MAX || ch > MAX) {
    const ratio = Math.min(MAX / cw, MAX / ch);
    cw = Math.round(cw * ratio); ch = Math.round(ch * ratio);
  }
  glCanvas.width = cw; glCanvas.height = ch;
  glCanvas.style.width  = cw + 'px';
  glCanvas.style.height = ch + 'px';
}

function activateUI() {
  dropZone.classList.add('has-media');
  btnGif.disabled = false;
  btnMp4.disabled = false;
  startTime = performance.now();
  if (!animFrame) requestAnimationFrame(render);
}

// ══════════════════════════════════════════════════════════════════════════════
//  SLIDER BINDINGS
// ══════════════════════════════════════════════════════════════════════════════
Object.entries(sliders).forEach(([key, el]) => {
  const valEl = document.getElementById('val-' + key);
  el.addEventListener('input', () => { valEl.textContent = parseFloat(el.value).toFixed(2); });
});

// ══════════════════════════════════════════════════════════════════════════════
//  PRESETS
// ══════════════════════════════════════════════════════════════════════════════
const presets = {
  default: { intensity:1.0, speed:0.5, caustics:0.6, aberration:0.5, specular:0.5, scale:1.0 },
  ripple:  { intensity:1.4, speed:1.2, caustics:0.9, aberration:0.3, specular:0.3, scale:1.2 },
  deep:    { intensity:2.0, speed:0.3, caustics:1.6, aberration:0.8, specular:0.7, scale:1.8 },
  wild:    { intensity:3.0, speed:1.8, caustics:2.0, aberration:2.0, specular:1.5, scale:3.0 },
  subtle:  { intensity:0.4, speed:0.25,caustics:0.3, aberration:0.2, specular:0.3, scale:0.8 },
  prism:   { intensity:1.2, speed:0.7, caustics:0.4, aberration:1.8, specular:1.2, scale:1.0 },
};

document.querySelectorAll('.preset-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const p = presets[btn.dataset.preset];
    Object.entries(p).forEach(([k, v]) => {
      sliders[k].value = v;
      document.getElementById('val-' + k).textContent = v.toFixed(2);
    });
  });
});

// ══════════════════════════════════════════════════════════════════════════════
//  FILE INPUT
// ══════════════════════════════════════════════════════════════════════════════
dropZone.addEventListener('click', e => {
  if (dropZone.classList.contains('has-media') && e.target !== btnChange) return;
  fileInput.click();
});
btnChange.addEventListener('click', e => { e.stopPropagation(); fileInput.click(); });
fileInput.addEventListener('change', () => { if (fileInput.files[0]) loadMedia(fileInput.files[0]); });

dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => { dropZone.classList.remove('drag-over'); });
dropZone.addEventListener('drop', e => {
  e.preventDefault(); dropZone.classList.remove('drag-over');
  if (e.dataTransfer.files[0]) loadMedia(e.dataTransfer.files[0]);
});

// ══════════════════════════════════════════════════════════════════════════════
//  EXPORT — MP4
// ══════════════════════════════════════════════════════════════════════════════
btnMp4.addEventListener('click', async () => {
  if (isExporting) return;
  isExporting = true;
  setExportButtons(false);
  const duration = parseInt(document.getElementById('export-duration').value);
  showProgress(0, 'recording mp4…');

  const stream = glCanvas.captureStream(30);
  const mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp9')
    ? 'video/webm;codecs=vp9'
    : MediaRecorder.isTypeSupported('video/webm') ? 'video/webm' : 'video/mp4';

  const recorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 8_000_000 });
  const chunks = [];
  recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };

  recorder.onstop = () => {
    const blob = new Blob(chunks, { type: mimeType });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'liquid-glass.' + (mimeType.includes('mp4') ? 'mp4' : 'webm');
    a.click();
    URL.revokeObjectURL(url);
    hideProgress();
    setExportButtons(true);
    isExporting = false;
    showToast('mp4 exported ✓');
  };

  recorder.start();
  const step = 100;
  let elapsed = 0;
  const tick = setInterval(() => {
    elapsed += step;
    showProgress(elapsed / (duration * 1000) * 100, `recording… ${(elapsed/1000).toFixed(1)}s / ${duration}s`);
    if (elapsed >= duration * 1000) { clearInterval(tick); recorder.stop(); }
  }, step);
});

// ══════════════════════════════════════════════════════════════════════════════
//  EXPORT — GIF
// ══════════════════════════════════════════════════════════════════════════════
btnGif.addEventListener('click', async () => {
  if (isExporting) return;
  isExporting = true;
  setExportButtons(false);

  const duration = parseInt(document.getElementById('export-duration').value);
  const quality  = parseInt(document.getElementById('gif-quality').value);
  const fps      = parseInt(document.getElementById('gif-fps').value);
  const frameCount = duration * fps;
  const delay = Math.round(1000 / fps);

  showProgress(0, 'loading gif encoder…');

  try {
    // Load gif.js worker as blob to avoid CORS issues
    const workerUrl = 'https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js';
    const workerResp = await fetch(workerUrl);
    const workerText = await workerResp.text();
    const workerBlob = new Blob([workerText], { type: 'text/javascript' });
    const workerBlobUrl = URL.createObjectURL(workerBlob);

    // Load gif.js library
    await new Promise((res, rej) => {
      if (window.GIF) { res(); return; }
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js';
      s.onload = res; s.onerror = rej;
      document.head.appendChild(s);
    });

    // Create a separate capture canvas (to avoid size constraints)
    const capCanvas = document.createElement('canvas');
    capCanvas.width  = glCanvas.width;
    capCanvas.height = glCanvas.height;
    const capCtx = capCanvas.getContext('2d');

    const gif = new GIF({
      workers: 2,
      quality,
      width:  glCanvas.width,
      height: glCanvas.height,
      workerScript: workerBlobUrl,
      transparent: null,
    });

    showProgress(0, `capturing frames (0 / ${frameCount})…`);

    // Capture frames by stepping time manually
    const savedStart = startTime;
    const baseTime = performance.now() - startTime;

    for (let i = 0; i < frameCount; i++) {
      // Advance simulated time
      const simTime = baseTime + i * (1000 / fps);
      startTime = performance.now() - simTime;

      // Force render at this time
      const elapsed = simTime * 0.001;
      gl.viewport(0, 0, glCanvas.width, glCanvas.height);
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.useProgram(program);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, texture);
      gl.uniform1i(uniforms.uTexture, 0);
      gl.uniform1f(uniforms.uTime, elapsed);
      gl.uniform1f(uniforms.uIntensity,  parseFloat(sliders.intensity.value));
      gl.uniform1f(uniforms.uSpeed,      parseFloat(sliders.speed.value));
      gl.uniform1f(uniforms.uCaustics,   parseFloat(sliders.caustics.value));
      gl.uniform1f(uniforms.uAberration, parseFloat(sliders.aberration.value));
      gl.uniform1f(uniforms.uSpecular,   parseFloat(sliders.specular.value));
      gl.uniform1f(uniforms.uScale,      parseFloat(sliders.scale.value));
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      // Also update video texture if needed
      if (mediaSource?.type === 'video') {
        uploadTexture(mediaSource.el);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      }

      capCtx.clearRect(0, 0, capCanvas.width, capCanvas.height);
      capCtx.drawImage(glCanvas, 0, 0);
      gif.addFrame(capCanvas, { copy: true, delay });

      showProgress((i + 1) / frameCount * 60, `capturing frames (${i + 1} / ${frameCount})…`);
      // Yield to browser occasionally
      if (i % 5 === 0) await new Promise(r => setTimeout(r, 0));
    }

    // Restore time
    startTime = savedStart;

    gif.on('progress', p => showProgress(60 + p * 40, `encoding gif… ${Math.round(p * 100)}%`));
    gif.on('finished', blob => {
      URL.revokeObjectURL(workerBlobUrl);
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'liquid-glass.gif';
      a.click();
      URL.revokeObjectURL(url);
      hideProgress();
      setExportButtons(true);
      isExporting = false;
      showToast('gif exported ✓');
    });

    gif.render();

  } catch (err) {
    console.error(err);
    showToast('export failed: ' + err.message, true);
    hideProgress();
    setExportButtons(true);
    isExporting = false;
  }
});

// ══════════════════════════════════════════════════════════════════════════════
//  HELPERS
// ══════════════════════════════════════════════════════════════════════════════
function showProgress(pct, label) {
  progressWrap.classList.add('active');
  progressFill.style.width = pct + '%';
  progressLbl.textContent = label;
}
function hideProgress() {
  progressWrap.classList.remove('active');
  progressFill.style.width = '0%';
}
function setExportButtons(enabled) {
  btnGif.disabled = !enabled;
  btnMp4.disabled = !enabled;
}
let toastTimer;
function showToast(msg, isErr = false) {
  toastEl.textContent = msg;
  toastEl.className = 'toast show' + (isErr ? ' error' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toastEl.classList.remove('show'); }, 3500);
}

// ══════════════════════════════════════════════════════════════════════════════
//  BOOT
// ══════════════════════════════════════════════════════════════════════════════
if (!initGL()) {
  showToast('WebGL unavailable — please use a modern browser', true);
}
requestAnimationFrame(render);
</script>
</body>
</html>
